<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DashDist</title>
<link href="vendor/maplibre-gl.css" rel="stylesheet">
<style>
:root{
  --bg:#0b0e13; --panel:#141a22; --panel2:#1b232e; --line:#27313e;
  --ink:#e8eef5; --muted:#8a97a7; --accent:#4cc2a0; --accent2:#f0a13a; --bad:#e05c5c;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1360px;margin:0 auto;padding:24px 16px 64px}
header h1{font-size:25px;margin:0 0 4px;letter-spacing:-.4px}
header p{margin:0;color:var(--muted);font-size:13.5px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:24px 0}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;
  position:relative;overflow:hidden}
.kpi:after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(76,194,160,.10),transparent 60%)}
.kpi .n{font-size:20px;font-weight:650}
.kpi .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-top:3px}
.mapbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0 8px}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--muted);padding:10px 16px;min-height:44px;font-size:13px;cursor:pointer}
.seg button.on{background:var(--accent);color:#07110d;font-weight:650}
select,input[type=search],.btn{background:var(--panel);border:1px solid var(--line);color:var(--ink);
  border-radius:8px;padding:12px 16px;font-size:16px;min-height:44px;outline:none}
.btn{cursor:pointer;display:inline-flex;align-items:center}
.btn:hover{border-color:var(--accent);color:var(--accent)}
#map{height:560px;border:1px solid var(--line);border-radius:10px;overflow:hidden;position:relative}
.mapnote{position:absolute;left:12px;bottom:12px;z-index:2;background:rgba(11,14,19,.86);
  border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--muted)}
.legend{position:absolute;right:12px;bottom:12px;z-index:2;background:rgba(11,14,19,.86);
  border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--muted)}
.legend .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle}
#panel{position:absolute;top:12px;right:12px;z-index:3;width:264px;background:rgba(20,26,34,.97);
  border:1px solid var(--line);border-radius:10px;padding:16px;font-size:13px;display:none}
#panel h3{margin:0 0 9px;font-size:14px}
#panel .row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--line)}
#panel .row:last-child{border:0}
#panel .k{color:var(--muted)}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0 16px;align-items:center}
input[type=search]{flex:1;min-width:190px}
input[type=search]:focus,select:focus{border-color:var(--accent)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{background:var(--panel);border:1px solid var(--line);color:var(--muted);
  padding:10px 16px;min-height:44px;display:inline-flex;align-items:center;
  border-radius:8px;font-size:13px;cursor:pointer}
.tab.on{background:var(--accent);color:#07110d;border-color:var(--accent);font-weight:650}
.tblwrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto;
  box-shadow:0 1px 2px rgba(0,0,0,.45),0 8px 24px rgba(0,0,0,.28)}
table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
th,td{padding:8px 12px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th:nth-child(2),td:nth-child(2){text-align:left}
th{position:sticky;top:0;background:var(--panel2);color:var(--muted);font-weight:600;
  font-size:10px;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;user-select:none}
th:hover{color:var(--ink)}
th .ar{opacity:.4;font-size:9px;margin-left:4px}
th.sorted .ar{opacity:1;color:var(--accent)}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--panel2)}
td.name{font-weight:500}
.pill{display:inline-block;padding:2px 7px;border-radius:99px;font-size:10px;
  border:1px solid var(--line);color:var(--muted)}
.bad{color:var(--bad)} .warn{color:var(--accent2)}
.foot{margin-top:24px;color:var(--muted);font-size:12px;line-height:1.75}
.foot code{background:var(--panel);padding:1px 5px;border-radius:4px}
.count{color:var(--muted);font-size:12px;margin-left:auto}
#lock{max-width:370px;margin:16vh auto;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:30px}
#lock h2{margin:0 0 6px;font-size:19px}
#lock p{margin:0 0 18px;color:var(--muted);font-size:13px}
#lock input{width:100%;margin-bottom:10px;background:var(--bg);border:1px solid var(--line);
  color:var(--ink);border-radius:8px;padding:10px 12px;font-size:14px}
#lock button{width:100%;background:var(--accent);border:0;color:#07110d;font-weight:650;
  padding:11px;border-radius:8px;font-size:14px;cursor:pointer}
#err{color:var(--bad);font-size:12px;min-height:16px;margin-top:8px}
@media(max-width:900px){.kpis{grid-template-columns:repeat(3,1fr)}#map{height:420px}}
@media(max-width:620px){.kpis{grid-template-columns:repeat(2,1fr)}.wrap{padding:16px 10px 40px}}

/* design numbers: focus ring, hit targets */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
input[type=search]::placeholder{color:#93a0b0;opacity:1}
th{min-height:36px}
@media(max-width:620px){select,input[type=search]{font-size:16px}}


/* ---------- charts tab ---------- */
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 16px 12px;
  box-shadow:0 1px 2px rgba(0,0,0,.45),0 10px 28px rgba(0,0,0,.28);opacity:0;transform:translateY(8px);
  animation:cardIn .32s var(--e-out) forwards}
.card:nth-child(2){animation-delay:.05s}.card:nth-child(3){animation-delay:.1s}.card:nth-child(4){animation-delay:.15s}
@keyframes cardIn{to{opacity:1;transform:none}}
.card h3{margin:0;font-size:13px;font-weight:600;color:var(--ink);letter-spacing:.01em}
.card p{margin:2px 0 12px;font-size:12px;color:var(--muted)}
.card .plot{width:100%;height:258px}
.card svg{display:block;width:100%;height:auto;overflow:visible}
.card .bar{transform-origin:left center;animation:barIn .5s var(--e-out) both}
@keyframes barIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.card .lbl{font-size:10.5px;fill:var(--muted)}
.card .val{font-size:10.5px;fill:var(--ink);font-variant-numeric:tabular-nums}
@media(max-width:820px){.charts{grid-template-columns:1fr}}

/* ---- motion system: 20 UX principles, kenisbuilding.com/resources ---- */
:root{
  --e-out:cubic-bezier(.16,1,.3,1);
  --e-in:cubic-bezier(.7,0,.84,0);
  --e-io:cubic-bezier(.65,0,.35,1);
  --d-feedback:120ms; --d-ui:220ms; --d-panel:320ms;
}
.kpi{transition:transform var(--d-ui) var(--e-out),border-color var(--d-ui) var(--e-out);
  animation:kpi-in 420ms var(--e-out) both}
.kpi:hover{transform:translateY(-3px);border-color:#3a4756}
@keyframes kpi-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.tab,.btn,.seg button{transition:background var(--d-feedback) var(--e-out),
  color var(--d-feedback) var(--e-out),border-color var(--d-feedback) var(--e-out),
  transform 90ms var(--e-out)}
.btn:active,.seg button:active,.tab:active{transform:scale(.96)}
tbody tr{transition:background var(--d-feedback) var(--e-out)}
#tbody.enter{animation:rows-in 240ms var(--e-out) both}
#tbody.enter tr:nth-child(-n+8){animation:rows-in 220ms var(--e-out) both}
#tbody.enter tr:nth-child(1){animation-delay:0ms}#tbody.enter tr:nth-child(2){animation-delay:30ms}
#tbody.enter tr:nth-child(3){animation-delay:60ms}#tbody.enter tr:nth-child(4){animation-delay:90ms}
#tbody.enter tr:nth-child(5){animation-delay:120ms}#tbody.enter tr:nth-child(6){animation-delay:150ms}
#tbody.enter tr:nth-child(7){animation-delay:180ms}#tbody.enter tr:nth-child(8){animation-delay:210ms}
@keyframes rows-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#panel{animation:panel-in var(--d-panel) var(--e-out) both}
@keyframes panel-in{from{opacity:0;transform:scale(.96) translateY(-4px)}to{opacity:1;transform:none}}
#lock.shake{animation:shake 300ms var(--e-io)}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}
  40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.kpi:nth-child(1){animation-delay:0ms}.kpi:nth-child(2){animation-delay:40ms}
.kpi:nth-child(3){animation-delay:80ms}.kpi:nth-child(4){animation-delay:120ms}
.kpi:nth-child(5){animation-delay:160ms}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<section id="lock">
  <h2>DashDist</h2>
  <p>Enter the passphrase to open the panel.</p>
  <input type="password" id="pw" placeholder="Passphrase" autocomplete="off">
  <button id="go">Open</button>
  <div id="err"></div>
</section>

<div class="wrap" id="app" hidden>
  <header>
    <h1>DashDist</h1>
    <p id="sub"></p>
  </header>

  <div class="kpis" id="kpis"></div>

  <div class="mapbar">
    <div class="seg" id="mode">
      <button data-m="2d" class="on">2D</button>
      <button data-m="3d">3D</button>
      <button data-m="globe">Globe</button>
    </div>
    <select id="metric">
      <option value="access">Colour: access rate</option>
      <option value="unserved_m">Colour: unserved people</option>
      <option value="losses">Colour: T&amp;D losses</option>
      <option value="km_per_1000km2">Colour: line density</option>
      <option value="year_access">Colour: data recency</option>
    </select>
    <button class="btn" id="gridtoggle">Grid lines: on</button>
  </div>

  <div id="map">
    <div id="panel"></div>
    <div class="mapnote" id="mapnote"></div>
    <div class="legend">
      <div><span class="sw" style="background:#22d3ee"></span>predicted network</div>
      <div><span class="sw" style="background:#5a6b7d"></span>no prediction</div>
    </div>
  </div>

  <div class="controls">
    <input type="search" id="q" placeholder="Search country or region">
    <select id="region"><option value="">All regions</option></select>
    <select id="income"><option value="">All income groups</option></select>
    <button class="btn" id="csv">Download CSV</button>
    <span class="count" id="count"></span>
  </div>

  <div class="tabs">
    <div class="tab on" data-t="access">Access gap</div>
    <div class="tab" data-t="perf">Consumption and losses</div>
    <div class="tab" data-t="net">Network</div>
    <div class="tab" data-t="cover">Data coverage</div>
    <div class="tab" data-t="charts">Charts</div>
  </div>

  <div id="charts" class="charts" hidden></div>

  <div class="tblwrap" id="tblwrap">
    <table>
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="foot" id="foot"></div>
</div>

<script src="vendor/echarts.min.js"></script>
<script src="vendor/deck.gl.min.js"></script>
<script src="data.js"></script>
<script type="module">
import * as maplibregl from './vendor/maplibre-gl.mjs';
window.maplibregl = maplibregl;

const PASS = "distribution";
const STYLE_URL = "https://tiles.openfreemap.org/styles/dark";

let ROWS=[], BY_ISO={}, TAB="access", SORT={key:"unserved_m",dir:-1};
let MAP=null, OVERLAY=null, MODE="2d", SHOW_GRID=true, GEO=null, GEOJSON=null;
let TILECACHE=new Map(), GRIDTIMER=null, LASTSIG="", GRIDDATA={type:"FeatureCollection",features:[]};
window.MAP=null;
window.__grid=()=>GRIDDATA.features.length;
window.__tiles=()=>Array.from(TILECACHE.keys()).length;
window.__raster=()=>{try{return MAP.getLayoutProperty("gp","visibility")}catch(e){return "none"}};
window.__rop=()=>{try{return String(MAP.getPaintProperty("gp","raster-opacity"))}catch(e){return "?"}};

const COLS = {
  access: [
    {k:"country",l:"Country",type:"s"},{k:"region",l:"Region",type:"s"},
    {k:"pop_m",l:"Population m",type:"n",d:1},{k:"access",l:"Access %",type:"n",d:1},
    {k:"urban",l:"Urban %",type:"n",d:1},{k:"rural",l:"Rural %",type:"n",d:1},
    {k:"unserved_m",l:"Unserved m",type:"n",d:2},
  ],
  perf: [
    {k:"country",l:"Country",type:"s"},{k:"region",l:"Region",type:"s"},
    {k:"kwh_pc",l:"kWh per capita",type:"n",d:0},{k:"losses",l:"T&D losses %",type:"n",d:1},
    {k:"gdp_pc",l:"GDP per capita USD",type:"n",d:0},{k:"income",l:"Income group",type:"s"},
  ],
  cover: [
    {k:"country",l:"Country",type:"s"},{k:"iso",l:"ISO",type:"s"},
    {k:"year_access",l:"Access year",type:"n",d:0},{k:"year_losses",l:"Loss year",type:"n",d:0},
    {k:"year_kwh",l:"Consumption year",type:"n",d:0},
  ],
  net: [
    {k:"country",l:"Country",type:"s"},{k:"region",l:"Region",type:"s"},
    {k:"net_km",l:"Predicted network km",type:"n",d:0},
    {k:"km_per_1000km2",l:"km per 1000 km²",type:"n",d:1},
    {k:"km_per_1000_people",l:"km per 1000 people",type:"n",d:1},
  ],
};

function fmt(v,c){
  if(v===null||v===undefined||v==="") return "<span class='pill'>n/a</span>";
  if(c.type==="n") return Number(v).toLocaleString("en-GB",{minimumFractionDigits:c.d||0,maximumFractionDigits:c.d||0});
  return v;
}
function median(a){const b=a.filter(x=>x!==null&&x!==undefined).sort((x,y)=>x-y);
  return b.length?b[Math.floor(b.length/2)]:0;}

function start(){
  const D=window.TRACKER_DATA;
  ROWS=D.rows.map(r=>Object.assign({},r,{region:(r.region||"").trim()}));
  ROWS.forEach(r=>BY_ISO[r.iso]=r);
  document.getElementById("sub").textContent=D.meta.subtitle+" · as of "+D.meta.as_of;
  buildKpis(); buildFilters(); render(); initMap();
}

function buildKpis(){
  const unserved=ROWS.reduce((a,r)=>a+r.unserved_m,0);
  const under90=ROWS.filter(r=>r.access<90).length;
  const lossMed=median(ROWS.map(r=>r.losses));
  const lossHigh=ROWS.filter(r=>r.losses>=15).length;
  document.getElementById("kpis").innerHTML=[
    [ROWS.length,"Countries"],[unserved.toFixed(0)+"m","Unserved people"],
    [under90,"Below 90% access"],[lossMed.toFixed(1)+"%","Median T&D losses"],
    [lossHigh,"Losses at 15%+"],
  ].map(([n,l])=>`<div class="kpi"><div class="n">${n}</div><div class="l">${l}</div></div>`).join("");
}

function buildFilters(){
  const rs=[...new Set(ROWS.map(r=>r.region.trim()))].sort();
  const is=[...new Set(ROWS.map(r=>r.income))].sort();
  document.getElementById("region").innerHTML+=rs.map(r=>`<option>${r}</option>`).join("");
  document.getElementById("income").innerHTML+=is.map(i=>`<option>${i}</option>`).join("");
}

function filtered(){
  const q=document.getElementById("q").value.toLowerCase().trim();
  const rg=document.getElementById("region").value;
  const ic=document.getElementById("income").value;
  return ROWS.filter(r=>{
    if(rg&&r.region.trim()!==rg) return false;
    if(ic&&r.income!==ic) return false;
    if(q&&!(r.country.toLowerCase().includes(q)||r.region.toLowerCase().includes(q))) return false;
    return true;
  });
}

function render(){
  const isCharts = TAB==="charts";
  document.getElementById("charts").hidden = !isCharts;
  document.getElementById("tblwrap").hidden = isCharts;
  if(isCharts){ drawCharts(); document.getElementById("count").textContent=ROWS.length+" countries"; return; }
  const cols=COLS[TAB], th=document.getElementById("thead");
  th.innerHTML="<tr>"+cols.map(c=>{
    const on=SORT.key===c.k, ar=on?(SORT.dir>0?"▲":"▼"):"◆";
    return `<th data-k="${c.k}" class="${on?'sorted':''}">${c.l}<span class="ar">${ar}</span></th>`;
  }).join("")+"</tr>";
  th.querySelectorAll("th").forEach(el=>el.onclick=()=>{
    const k=el.dataset.k;
    if(SORT.key===k) SORT.dir*=-1;
    else {SORT.key=k; SORT.dir=(COLS[TAB].find(c=>c.k===k).type==="s")?1:-1;}
    render();
  });
  const rows=filtered().slice().sort((a,b)=>{
    const av=a[SORT.key], bv=b[SORT.key];
    if(av===null||av===undefined) return 1;
    if(bv===null||bv===undefined) return -1;
    if(typeof av==="string") return av.localeCompare(bv)*SORT.dir;
    return (av-bv)*SORT.dir;
  });
  document.getElementById("tbody").innerHTML=rows.map(r=>{
    const tds=cols.map((c,i)=>{
      let v=fmt(r[c.k],c);
      if(i===0) return `<td class="name">${v}</td>`;
      if(c.k==="access"&&r.access<50) v=`<span class="bad">${v}</span>`;
      if(c.k==="losses"&&r.losses>=15) v=`<span class="warn">${v}</span>`;
      return `<td>${v}</td>`;
    }).join("");
    return `<tr data-iso="${r.iso}">${tds}</tr>`;
  }).join("");
  document.querySelectorAll("#tbody tr").forEach(tr=>tr.onclick=()=>focusCountry(tr.dataset.iso));
  const tb=document.getElementById("tbody");
  tb.classList.remove("enter"); void tb.offsetWidth; tb.classList.add("enter");
  document.getElementById("count").textContent=rows.length+" of "+ROWS.length+" countries";
  document.getElementById("foot").innerHTML=
    "Country panel drawn from World Bank World Development Indicators, latest observation per series. "+
    "Unserved people is derived as population times one minus the access rate.<br>"+
    "Map: ESMAP gridfinder predicted distribution and transmission network (World Bank, CC BY 4.0). "+
    "Below zoom 4 the network is drawn as a density field built from line length per quarter-degree cell. "+
    "Above zoom 3 the same source is drawn as vector lines from static tiles generated locally from grid.gpkg. "+
    "No third-party service is queried at runtime. Model validation is about 70% at 1 km.<br>"+
    "Basemap: OpenFreeMap, OpenStreetMap data, no API key. Rendering: MapLibre GL JS 6.19 plus deck.gl 9.4, BSD-3 and MIT. "+
    "Countries under 5 million population excluded.";
}

function downloadCsv(){
  const cols=COLS[TAB]; if(!cols) return;
  const rows=filtered();
  const head=cols.map(c=>c.l).join(",");
  const body=rows.map(r=>cols.map(c=>{
    const v=r[c.k]; if(v===null||v===undefined) return "";
    const s=String(v); return s.includes(",")?`"${s}"`:s;
  }).join(",")).join("\n");
  const blob=new Blob([head+"\n"+body],{type:"text/csv"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="distribution_"+TAB+".csv"; a.click();
}


/* ---------- charts (Apache ECharts 6.1) ---------- */
const ECH=[];
function disposeCharts(){while(ECH.length){try{ECH.pop().dispose()}catch(e){}}}
function ech(id,opt){
  const el=document.getElementById(id); if(!el) return;
  const c=echarts.init(el,null,{renderer:"canvas"});
  c.setOption(opt); ECH.push(c);
}
const CFA={"fontFamily":"Inter,system-ui,-apple-system,Segoe UI,sans-serif","color":"#c9d6e2"};
function axis(){return{
  axisLine:{lineStyle:{color:"#22303d"}}, axisTick:{show:false},
  axisLabel:{color:"#8fa3b5",fontSize:11}, splitLine:{lineStyle:{color:"#1b2530"}}
};}
function tip(extra){return Object.assign({backgroundColor:"rgba(11,14,19,.95)",borderColor:"#22303d",
  borderWidth:1,textStyle:{color:"#e6edf3",fontSize:12},extraCssText:"border-radius:8px;"},extra||{});}

function drawCharts(){
  disposeCharts();
  const rows=filtered();
  const el=document.getElementById("charts");
  el.innerHTML=[
    ["c1","Unserved people by region","Millions without electricity access"],
    ["c2","Line density leaders","Predicted network km per 1,000 km2"],
    ["c3","Access against density","Bubble size is population, colour is losses"],
    ["c4","Unserved by country","Top 24 countries, area scaled to people"],
  ].map(([id,t,sub])=>`<div class="card"><h3>${t}</h3><p>${sub}</p><div class="plot" id="${id}"></div></div>`).join("");
  requestAnimationFrame(()=>{ chartRegions(rows); chartDensity(rows); chartScatter(rows); chartTreemap(rows); });
}

function chartRegions(rows){
  const agg={};
  rows.forEach(r=>{const k=(r.region||"Other").trim();agg[k]=(agg[k]||0)+r.unserved_m;});
  const top=Object.entries(agg).sort((a,b)=>b[1]-a[1]).slice(0,9);
  ech("c1",{
    textStyle:CFA, tooltip:tip({trigger:"item",formatter:p=>`<b>${p.name}</b><br>${Math.round(p.value)} million`}),
    series:[{
      type:"pie", roseType:"area", radius:["28%","78%"], center:["50%","54%"],
      itemStyle:{borderRadius:6,borderColor:"#121820",borderWidth:2,

window.addEventListener("resize",()=>{ECH.forEach(c=>{try{c.resize()}catch(e){}})});
/* ---------- map ---------- */
const RAMP={
  access:["#6b1f1f","#9c3a32","#c06a34","#c99a3a","#6fae7a","#2f8f6f"],
  unserved_m:["#1d2a33","#28505c","#357f6e","#63b287","#f0a13a","#e05c5c"],
  losses:["#1d2a33","#28505c","#357f6e","#c99a3a","#e07b3a","#e05c5c"],
  km_per_1000km2:["#1d2a33","#28505c","#357f6e","#63b287","#c9c83a","#f0a13a"],
  year_access:["#6b1f1f","#9c3a32","#c06a34","#c99a3a","#6fae7a","#2f8f6f"],
};
const RANGE={access:[0,100],unserved_m:[0,60],losses:[0,30],km_per_1000km2:[0,600],year_access:[2010,2026]};
const TABMETRIC={access:"access",perf:"losses",net:"km_per_1000km2",cover:"year_access"};

function hex2rgb(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16),210];}
function rampColour(metric,v){
  const c=RAMP[metric], [lo,hi]=RANGE[metric];
  if(v===null||v===undefined||isNaN(v)) return [60,70,84,140];
  const t=Math.max(0,Math.min(1,(v-lo)/(hi-lo)));
  const i=Math.min(c.length-2,Math.floor(t*(c.length-1)));
  const f=t*(c.length-1)-i;
  const a=hex2rgb(c[i]), b=hex2rgb(c[i+1]);
  return [0,1,2,3].map(k=>Math.round(a[k]+(b[k]-a[k])*f));
}

function buildGeo(){
  const feats=[];
  (GEO.features||[]).forEach(f=>{
    const r=BY_ISO[f.properties.iso]; if(!r) return;
    feats.push({type:"Feature",geometry:f.geometry,
      properties:{iso:r.iso,access:r.access,unserved_m:r.unserved_m,losses:r.losses,
        km_per_1000km2:Number(r.km_per_1000km2)||0,year_access:Number(r.year_access)||2010}});
  });
  return {type:"FeatureCollection",features:feats};
}

let METRIC="access";

function deckLayers(){
  const m=METRIC;
  const extrusion = MODE!=="2d";
  const L=[
    new deck.GeoJsonLayer({
      id:"countries",
      data:GEOJSON,
      filled:true, stroked:true, extruded:extrusion, wireframe:false,
      getFillColor:d=>rampColour(m,d.properties[m]),
      getLineColor:[10,14,19,160],
      getLineWidth:1, lineWidthUnits:"pixels",
      getElevation:d=>extrusion?(d.properties.unserved_m||0)*14000:0,
      elevationScale:1,
      material:{ambient:0.55,diffuse:0.6,shininess:12,specularColor:[40,60,60]},
      pickable:true,
      onClick:info=>{ if(info.object) focusCountry(info.object.properties.iso,false); },
      updateTriggers:{getFillColor:[m],getElevation:[extrusion]}
    })
  ];
  if(SHOW_GRID){
    L.push(new deck.GeoJsonLayer({
      id:"gridhalo",
      data:GRIDDATA,
      filled:false, stroked:true,
      getLineColor:[2,7,10,235],
      getLineWidth:4.4, lineWidthUnits:"pixels",
      pickable:false
    }));
    L.push(new deck.GeoJsonLayer({
      id:"gridlines",
      data:GRIDDATA,
      filled:false, stroked:true,
      getLineColor:d=>d.properties&&d.properties.source==="osm"?[251,191,36,255]:[34,211,238,255],
      getLineWidth:1.8, lineWidthUnits:"pixels",
      pickable:false
    }));
  }
  return L;
}

function refreshDeck(){
  if(OVERLAY) OVERLAY.setProps({layers:deckLayers()});
}

function initMap(){
  fetch("data/countries.geo.json").then(r=>r.json()).then(geo=>{
    GEO=geo; GEOJSON=buildGeo();
    MAP=new maplibregl.Map({
      container:"map", style:STYLE_URL,
      center:[18,12], zoom:2.1, pitch:0, bearing:0,
      attributionControl:{compact:true}
    });
    window.MAP=MAP;

    MAP.on("load",()=>{
      MAP.addSource("gridpresence",{type:"image",url:"data/density.png",
        coordinates:[[-178.277,75.002],[178.619,75.002],[178.619,-55.973],[-178.277,-55.973]]});
      MAP.addLayer({id:"gp",type:"raster",source:"gridpresence",
        paint:{"raster-opacity":["interpolate",["linear"],["zoom"],2.4,0.95,3.6,0.55,4.4,0.0],
               "raster-fade-duration":0,"raster-resampling":"linear"}});

      OVERLAY=new deck.MapboxOverlay({interleaved:true, layers:deckLayers()});
      window.OVERLAY=OVERLAY;
      MAP.addControl(OVERLAY);

      MAP.on("moveend",()=>{refreshGrid();updateNote();});
      document.querySelectorAll("#mode button").forEach(b=>b.onclick=()=>setMode(b.dataset.m));
      document.getElementById("metric").onchange=()=>{
        METRIC=document.getElementById("metric").value; refreshDeck();
      };
      document.getElementById("gridtoggle").onclick=e=>{
        SHOW_GRID=!SHOW_GRID;
        e.target.textContent="Grid lines: "+(SHOW_GRID?"on":"off");
        MAP.setLayoutProperty("gp","visibility",SHOW_GRID?"visible":"none");
        refreshDeck();
      };
      refreshGrid(); updateNote();
    });
  });
}

function setMode(m){
  MODE=m;
  document.querySelectorAll("#mode button").forEach(b=>b.classList.toggle("on",b.dataset.m===m));
  if(m==="2d"){
    MAP.setProjection({type:"mercator"});
    MAP.easeTo({pitch:0,bearing:0,duration:600});
  } else if(m==="3d"){
    MAP.setProjection({type:"mercator"});
    MAP.easeTo({pitch:52,bearing:-18,duration:700});
  } else {
    MAP.setProjection({type:"globe"});
    MAP.easeTo({pitch:22,bearing:0,duration:700});
  }
  refreshDeck();
}

function updateNote(){
  const z=MAP.getZoom();
  const el=document.getElementById("mapnote");
  if(!SHOW_GRID){
    el.textContent="Grid lines hidden. Shading shows predicted presence.";
  } else if(z<3){
    el.textContent="World view: predicted grid presence as shading. Zoom past level 3 for line geometry.";
  } else {
    el.textContent="Predicted network, drawn from the local gridfinder extract. No external service is called.";
  }
}

function applyRasterVisibility(){
  if(!MAP||!MAP.getLayer("gp")) return;
  MAP.setLayoutProperty("gp","visibility",SHOW_GRID?"visible":"none");
}

function tileRange(z,b){
  const n=2**z;
  const tx0=Math.floor((b.getWest()+180)/360*n), tx1=Math.floor((b.getEast()+180)/360*n);
  const ty0=Math.floor((1-Math.log(Math.tan(Math.PI/4+Math.max(-85,Math.min(85,b.getNorth()))*Math.PI/360))/Math.PI)/2*n);
  const ty1=Math.floor((1-Math.log(Math.tan(Math.PI/4+Math.max(-85,Math.min(85,b.getSouth()))*Math.PI/360))/Math.PI)/2*n);
  const out=[];
  for(let x=Math.max(0,tx0);x<=Math.min(n-1,tx1);x++)
    for(let y=Math.max(0,ty0);y<=Math.min(n-1,ty1);y++) out.push([z,x,y]);
  return out;
}

function loadTiles(list){
  const jobs=list.map(([z,x,y])=>{
    const key=z+"/"+x+"_"+y;
    if(TILECACHE.has(key)) return Promise.resolve(TILECACHE.get(key));
    return fetch("data/tiles/"+key+".json")
      .then(r=>r.ok?r.json():null)
      .then(g=>{ if(g) TILECACHE.set(key,g); return g; })
      .catch(()=>null);
  });
  return Promise.all(jobs);
}

function refreshGrid(){
  applyRasterVisibility();
  if(!MAP||!SHOW_GRID){ GRIDDATA={type:"FeatureCollection",features:[]}; refreshDeck(); return; }
  const z=MAP.getZoom();
  if(z<3){
    if(GRIDDATA.features.length){ GRIDDATA={type:"FeatureCollection",features:[]}; refreshDeck(); }
    return;
  }
  const lvl = z<4.5 ? 4 : 5;
  const list = tileRange(lvl, MAP.getBounds());
  const sig = lvl+":"+list.length+":"+list.map(t=>t[1]+"_"+t[2]).join(",");
  if(sig===LASTSIG) return;
  LASTSIG=sig;
  clearTimeout(GRIDTIMER);
  GRIDTIMER=setTimeout(()=>{
    loadTiles(list).then(gs=>{
      const features=gs.filter(Boolean).map(g=>({type:"Feature",properties:{},geometry:g}));
      GRIDDATA={type:"FeatureCollection",features};
      refreshDeck(); updateNote();
      document.getElementById("mapnote").dataset.tiles=String(features.length);
    });
  },250);
}

function focusCountry(iso,fly=true){
  const r=BY_ISO[iso]; if(!r) return;
  const p=document.getElementById("panel");
  p.style.display="block";
  p.innerHTML=`<h3>${r.country}</h3>
    <div class="row"><span class="k">Population</span><span>${r.pop_m} m</span></div>
    <div class="row"><span class="k">Access</span><span>${r.access}%</span></div>
    <div class="row"><span class="k">Urban / rural</span><span>${r.urban} / ${r.rural}</span></div>
    <div class="row"><span class="k">Unserved</span><span>${r.unserved_m} m</span></div>
    <div class="row"><span class="k">T&amp;D losses</span><span>${r.losses}%</span></div>
    <div class="row"><span class="k">kWh per capita</span><span>${r.kwh_pc}</span></div>`;
  if(fly&&GEO){
    const f=GEO.features.find(x=>x.properties.iso===iso);
    if(f){
      const bb=new maplibregl.LngLatBounds();
      const walk=c=>{ if(typeof c[0]==="number") bb.extend(c); else c.forEach(walk); };
      walk(f.geometry.coordinates);
      MAP.fitBounds(bb,{padding:70,maxZoom:6,duration:900});
    }
  }
}

document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
  t.classList.add("on"); TAB=t.dataset.t;
  const m=TABMETRIC[TAB];
  if(m){ METRIC=m; const sel=document.getElementById("metric"); if(sel) sel.value=m; refreshDeck(); }
  const csv=document.getElementById("csv"); if(csv) csv.style.display = TAB==="charts" ? "none" : "";
  if(COLS[TAB]) SORT={key:COLS[TAB][0].k,dir:1};
  render();
});

document.getElementById("region").onchange=render;
document.getElementById("income").onchange=render;
