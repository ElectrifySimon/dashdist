<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Distribution Grid Dashboard</title>
<style>
:root{
  --bg:#0e1116; --panel:#161b22; --panel2:#1c2230; --line:#2a3340;
  --ink:#e6edf3; --muted:#8b98a8; --accent:#4cc2a0; --accent2:#f0a13a; --bad:#e05c5c;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
a{color:var(--accent)}
.wrap{max-width:1240px;margin:0 auto;padding:28px 20px 64px}
header h1{font-size:24px;margin:0 0 4px;letter-spacing:-.3px}
header p{margin:0;color:var(--muted);font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi .n{font-size:22px;font-weight:600}
.kpi .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-top:3px}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 14px;align-items:center}
input[type=search],select{background:var(--panel);border:1px solid var(--line);color:var(--ink);
  border-radius:8px;padding:9px 11px;font-size:13px;outline:none}
input[type=search]{flex:1;min-width:200px}
input[type=search]:focus,select:focus{border-color:var(--accent)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{background:var(--panel);border:1px solid var(--line);color:var(--muted);
  padding:8px 14px;border-radius:8px;font-size:13px;cursor:pointer}
.tab.on{background:var(--accent);color:#07110d;border-color:var(--accent);font-weight:600}
.tblwrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th:nth-child(2),td:nth-child(2){text-align:left}
th{position:sticky;top:0;background:var(--panel2);color:var(--muted);font-weight:600;
  font-size:11px;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;user-select:none}
th:hover{color:var(--ink)}
th .ar{opacity:.4;font-size:9px;margin-left:4px}
th.sorted .ar{opacity:1;color:var(--accent)}
tbody tr:hover{background:var(--panel2)}
td.name{font-weight:500}
.pill{display:inline-block;padding:2px 7px;border-radius:99px;font-size:10px;
  border:1px solid var(--line);color:var(--muted)}
.bad{color:var(--bad)} .good{color:var(--accent)} .warn{color:var(--accent2)}
.foot{margin-top:26px;color:var(--muted);font-size:12px;line-height:1.7}
.foot code{background:var(--panel);padding:1px 5px;border-radius:4px}
.btn{background:var(--panel);border:1px solid var(--line);color:var(--ink);
  padding:9px 13px;border-radius:8px;font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
#lock{max-width:360px;margin:16vh auto;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:28px}
#lock h2{margin:0 0 6px;font-size:18px}
#lock p{margin:0 0 18px;color:var(--muted);font-size:13px}
#lock input{width:100%;margin-bottom:10px}
#lock button{width:100%;background:var(--accent);border:0;color:#07110d;font-weight:600;
  padding:10px;border-radius:8px;font-size:14px;cursor:pointer}
#err{color:var(--bad);font-size:12px;min-height:16px;margin-top:8px}
.count{color:var(--muted);font-size:12px;margin-left:auto}
@media(max-width:760px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .wrap{padding:18px 12px 40px}
  th,td{padding:8px 9px}
}
</style>
</head>
<body>

<div class="wrap" id="app">
  <header>
    <h1>Distribution Grid Dashboard</h1>
    <p id="sub"></p>
  </header>

  <div class="kpis" id="kpis"></div>

  <div class="controls">
    <input type="search" id="q" placeholder="Search country or region">
    <select id="region"><option value="">All regions</option></select>
    <select id="income"><option value="">All income groups</option></select>
    <button class="btn" id="csv">Download CSV</button>
    <span class="count" id="count"></span>
  </div>

  <div class="tabs">
    <div class="tab on" data-t="access">Access gap</div>
    <div class="tab" data-t="perf">Consumption and losses</div>
    <div class="tab" data-t="cover">Data coverage</div>
  </div>

  <div class="tblwrap">
    <table>
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="foot" id="foot"></div>
</div>

<script>
const PASS = "antalya-grid-2026";
let DATA = null, ROWS = [], TAB = "access", SORT = {key:"unserved_m", dir:-1};

const COLS = {
  access: [
    {k:"country", l:"Country", type:"s"},
    {k:"region", l:"Region", type:"s"},
    {k:"pop_m", l:"Population m", type:"n", d:1},
    {k:"access", l:"Access %", type:"n", d:1},
    {k:"urban", l:"Urban %", type:"n", d:1},
    {k:"rural", l:"Rural %", type:"n", d:1},
    {k:"unserved_m", l:"Unserved m", type:"n", d:2},
  ],
  perf: [
    {k:"country", l:"Country", type:"s"},
    {k:"region", l:"Region", type:"s"},
    {k:"kwh_pc", l:"kWh per capita", type:"n", d:0},
    {k:"losses", l:"T&D losses %", type:"n", d:1},
    {k:"gdp_pc", l:"GDP per capita USD", type:"n", d:0},
    {k:"income", l:"Income group", type:"s"},
  ],
  cover: [
    {k:"country", l:"Country", type:"s"},
    {k:"iso", l:"ISO", type:"s"},
    {k:"year_access", l:"Access year", type:"n", d:0},
    {k:"year_losses", l:"Loss year", type:"n", d:0},
    {k:"year_kwh", l:"Consumption year", type:"n", d:0},
  ],
};

function fmt(v, c){
  if(v===null||v===undefined||v==="") return "<span class='pill'>n/a</span>";
  if(c.type==="n") return Number(v).toLocaleString("en-GB",{minimumFractionDigits:c.d||0,maximumFractionDigits:c.d||0});
  return v;
}

function start(){
  DATA = window.TRACKER_DATA;
  ROWS = DATA.rows.map(r=>Object.assign({}, r, {region:(r.region||"").trim()}));
  document.getElementById("sub").textContent = DATA.meta.subtitle + " · as of " + DATA.meta.as_of;
  buildKpis(); buildFilters(); render();
}

function buildKpis(){
  const total = ROWS.length;
  const unserved = ROWS.reduce((a,r)=>a+r.unserved_m,0);
  const lossMed = median(ROWS.map(r=>r.losses));
  const under90 = ROWS.filter(r=>r.access<90).length;
  document.getElementById("kpis").innerHTML = [
    [total, "Countries"],
    [unserved.toFixed(0)+"m", "Unserved people"],
    [under90, "Below 90% access"],
    [lossMed.toFixed(1)+"%", "Median T&D losses"],
  ].map(([n,l])=>`<div class="kpi"><div class="n">${n}</div><div class="l">${l}</div></div>`).join("");
}

function median(a){const b=a.filter(x=>x!==null&&x!==undefined).sort((x,y)=>x-y);
  return b.length?(b[Math.floor(b.length/2)]):0;}

function buildFilters(){
  const rs=[...new Set(ROWS.map(r=>r.region.trim()))].sort();
  const is=[...new Set(ROWS.map(r=>r.income))].sort();
  document.getElementById("region").innerHTML += rs.map(r=>`<option>${r}</option>`).join("");
  document.getElementById("income").innerHTML += is.map(i=>`<option>${i}</option>`).join("");
}

function filtered(){
  const q=document.getElementById("q").value.toLowerCase().trim();
  const rg=document.getElementById("region").value;
  const ic=document.getElementById("income").value;
  return ROWS.filter(r=>{
    if(rg && r.region.trim()!==rg) return false;
    if(ic && r.income!==ic) return false;
    if(q && !(r.country.toLowerCase().includes(q)||r.region.toLowerCase().includes(q))) return false;
    return true;
  });
}

function render(){
  const cols=COLS[TAB];
  const th=document.getElementById("thead");
  th.innerHTML="<tr>"+cols.map(c=>{
    const on = SORT.key===c.k;
    const ar = on ? (SORT.dir>0?"▲":"▼") : "◆";
    return `<th data-k="${c.k}" class="${on?'sorted':''}">${c.l}<span class="ar">${ar}</span></th>`;
  }).join("")+"</tr>";
  th.querySelectorAll("th").forEach(el=>el.onclick=()=>{
    const k=el.dataset.k;
    if(SORT.key===k) SORT.dir*=-1; else {SORT.key=k; SORT.dir=(COLS[TAB].find(c=>c.k===k).type==="s")?1:-1;}
    render();
  });

  const rows=filtered().slice().sort((a,b)=>{
    const av=a[SORT.key], bv=b[SORT.key];
    if(av===null||av===undefined) return 1;
    if(bv===null||bv===undefined) return -1;
    if(typeof av==="string") return av.localeCompare(bv)*SORT.dir;
    return (av-bv)*SORT.dir;
  });

  document.getElementById("tbody").innerHTML = rows.map(r=>"<tr>"+cols.map((c,i)=>{
    let v=fmt(r[c.k],c);
    if(i===0) return `<td class="name">${v}</td>`;
    if(c.k==="access" && r.access<50) v=`<span class="bad">${v}</span>`;
    if(c.k==="losses" && r.losses>=15) v=`<span class="warn">${v}</span>`;
    return `<td>${v}</td>`;
  }).join("")+"</tr>").join("");

  document.getElementById("count").textContent = rows.length+" of "+ROWS.length+" countries";
  document.getElementById("foot").innerHTML =
    DATA.meta.note + "<br>Source: World Bank World Development Indicators, indicators "+
    "<code>EG.ELC.ACCS.ZS</code>, <code>EG.ELC.ACCS.UR.ZS</code>, <code>EG.ELC.ACCS.RU.ZS</code>, "+
    "<code>EG.ELC.LOSS.ZS</code>, <code>EG.USE.ELEC.KH.PC</code>, <code>SP.POP.TOTL</code>, "+
    "<code>NY.GDP.PCAP.CD</code>. Countries under 5 million population excluded.";
}

function downloadCsv(){
  const cols=COLS[TAB];
  const rows=filtered();
  const head=cols.map(c=>c.l).join(",");
  const body=rows.map(r=>cols.map(c=>{
    const v=r[c.k];
    if(v===null||v===undefined) return "";
    const s=String(v);
    return s.includes(",")?`"${s}"`:s;
  }).join(",")).join("\n");
  const blob=new Blob([head+"\n"+body],{type:"text/csv"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="distribution_"+TAB+".csv";
  a.click();
}

document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
  t.classList.add("on");
  TAB=t.dataset.t;
  SORT={key:COLS[TAB][0].k, dir:1};
  render();
});
document.getElementById("q").oninput=render;
document.getElementById("region").onchange=render;
document.getElementById("income").onchange=render;
document.getElementById("csv").onclick=downloadCsv;

  start();
</script>
</body>
